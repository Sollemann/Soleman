<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4" />
  
  <!-- Sneaker Outsole Artwork -->
  <g transform="translate(64, 70) scale(6)" filter="url(#glow)">
    <!-- Sneaker Outsole Base -->
    <path d="M8 47C10 49 14 50 24 50C36 50 48 49 54 46C56 45 57 43 57 41L56 38L9 38L8 42C7.5 44 7 46 8 47Z" fill="url(#gold)" />
    <!-- Treads -->
    <path d="M14 49L17 40M22 49L25 40M30 49L33 40M38 49L41 40M46 48L49 40M52 46L54 40" stroke="#020617" stroke-width="2" stroke-linecap="round" />
    <!-- Midsole layer -->
    <path d="M9 38L56 38L54 33C52 33 44 34 32 34C20 34 14 33 11 34L9 38Z" fill="#f8fafc" />
    <!-- Upper shoe body -->
    <path d="M11 34L18 20C21 16 28 17 33 22L44 26C49 28 53 30 54 33L11 34Z" fill="#1e293b" stroke="url(#gold)" stroke-width="1.5" />
    <!-- Laces / detail stitches -->
    <path d="M26 21L29 25M30 22L33 26M34 23L37 27" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round" />
    <!-- Collar & Tongue -->
    <path d="M18 20L15 15C13 15 11 17 11 20L11 34" fill="#334155" />
  </g>

  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">SOLEMAN</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="6">CIREBON</text>
</svg>
