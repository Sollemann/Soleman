    <script>
      (function() {
        if (typeof window === 'undefined') return;
        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            (String(event.reason?.message || '').includes('WebSocket') ||
             String(event.reason?.stack || '').includes('@vite/client') ||
             String(event.reason?.stack || '').includes('createWebSocketModuleRunnerTransport'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (
            String(event?.message || '').includes('WebSocket') ||
            String(event?.filename || '').includes('@vite/client')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        try {
          var OrigWS = window.WebSocket;
          if (OrigWS) {
            function MockHMRWebSocket(url, protocols) {
              if (
                protocols === 'vite-hmr' ||
                (typeof url === 'string' && (url.includes('token=') || url.includes('vite')))
              ) {
                var target = new EventTarget();
                target.readyState = 1;
                target.OPEN = 1;
                target.CLOSED = 3;
                target.CLOSING = 2;
                target.CONNECTING = 0;
                target.send = function() {};
                target.close = function() {};
                setTimeout(function() {
                  target.dispatchEvent(new Event('open'));
                }, 0);
                return target;
              }
              return new OrigWS(url, protocols);
            }
            MockHMRWebSocket.prototype = OrigWS.prototype;
            MockHMRWebSocket.CONNECTING = 0;
            MockHMRWebSocket.OPEN = 1;
            MockHMRWebSocket.CLOSING = 2;
            MockHMRWebSocket.CLOSED = 3;
            window.WebSocket = MockHMRWebSocket;
          }
        } catch (e) {}
      })();
    </script>
